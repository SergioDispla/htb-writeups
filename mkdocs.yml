site_name: HTB Write-ups
site_description: Personal collection of write-ups for retired Hack The Box machines.
site_url: https://SergioDispla.github.io/htb-writeups/

repo_url: https://github.com/SergioDispla/htb-writeups
repo_name: SergioDispla/htb-writeups
edit_uri: edit/main/

docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Roboto
    code: JetBrains Mono
  icon:
    logo: material/shield-key
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search
  - tags
  - awesome-pages

exclude_docs: |
  _template/
  _scripts/
  .github/
  LICENSE
  CLAUDE.md
  *.local.md
  notes-private/

# links.not_found is downgraded to info because some machine READMEs contain
# Notion export artifacts (UUID-named .md links) and missing image files that
# pre-date this MkDocs setup and cannot be fixed without editing the writeups.
validation:
  links:
    not_found: info

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.mark

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SergioDispla
      name: GitHub
